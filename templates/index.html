<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaCorp — SecureBot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --nova-blue: #1a237e;
      --nova-blue-light: #283593;
      --bg: #eef1f6;
      --bot-bubble: #f0f2f5;
      --text: #1f2330;
      --muted: #6b7280;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---------- Top brand header ---------- */
    header.site-header {
      background: var(--nova-blue);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: linear-gradient(135deg, #3949ab, #5c6bc0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .brand-text .tagline {
      font-size: 12px;
      color: #c5cae9;
      margin-top: 2px;
    }

    /* ---------- Main chat layout ---------- */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .chat-card {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(26, 35, 126, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 200px);
      min-height: 480px;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #eceef3;
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
      flex-shrink: 0;
    }

    .chat-header .titles h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .chat-header .titles .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ---------- Messages ---------- */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #fafbfc;
    }

    .row {
      display: flex;
      width: 100%;
    }

    .row.user {
      justify-content: flex-end;
    }

    .row.bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .row.user .bubble {
      background: var(--nova-blue);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .row.bot .bubble {
      background: var(--bot-bubble);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .row.bot .bubble.error {
      background: #fff1f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* ---------- Typing indicator ---------- */
    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: var(--bot-bubble);
      border-radius: 16px;
      border-bottom-left-radius: 5px;
      width: fit-content;
    }

    .typing.show {
      display: flex;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aa3b2;
      animation: bounce 1.3s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ---------- Action notice ---------- */
    .action-notice {
      font-size: 12px;
      font-family: monospace;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 6px 12px;
      max-width: 78%;
      word-break: break-all;
    }

    /* ---------- Input area ---------- */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #eceef3;
      background: #fff;
    }

    #input {
      flex: 1;
      resize: none;
      border: 1px solid #d6dae3;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 14.5px;
      font-family: inherit;
      line-height: 1.4;
      max-height: 120px;
      outline: none;
      transition: border-color 0.15s;
    }

    #input:focus {
      border-color: var(--nova-blue-light);
    }

    #send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--nova-blue);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }

    #send:hover:not(:disabled) {
      background: var(--nova-blue-light);
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #send svg {
      width: 20px;
      height: 20px;
    }

    /* ---------- Footer ---------- */
    footer.site-footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo-mark">N</div>
    <div class="brand-text">
      <h1>NovaCorp</h1>
      <div class="tagline">Customer Support Portal</div>
    </div>
  </header>

  <main>
    <section class="chat-card">
      <div class="chat-header">
        <span class="status-dot" aria-hidden="true"></span>
        <div class="titles">
          <h2>SecureBot</h2>
          <div class="sub">AI-powered customer service · Typically replies instantly</div>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="row bot">
          <div class="bubble">Hi there! I'm SecureBot, your NovaCorp customer service assistant. How can I help you today?</div>
        </div>
        <div class="row bot" id="typing-row" style="display: none;">
          <div class="typing" id="typing" aria-label="SecureBot is typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div class="input-area">
        <textarea
          id="input"
          rows="1"
          placeholder="Type your message…"
          autocomplete="off"
        ></textarea>
        <button id="send" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    SecureBot v2.1 · Powered by NovaCorp AI · © 2024 NovaCorp Inc.
  </footer>

  <script>
    // Conversation history maintained in JS state and sent with every request.
    let history = [];

    const messagesEl = document.getElementById("messages");
    const typingRow = document.getElementById("typing-row");
    const typingEl = document.getElementById("typing");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Append a message bubble to the chat. The typing-indicator row is always kept last.
    function addBubble(text, who, isError) {
      const row = document.createElement("div");
      row.className = "row " + (who === "user" ? "user" : "bot");

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (isError ? " error" : "");

      if (who === "user") {
        // User input is rendered as text — safe.
        bubble.textContent = text;
      } else if (isError) {
        bubble.textContent = text;
      } else {
        // Model output is attacker-influenced (prompt injection) — render as text, never as HTML.
        bubble.textContent = text;
      }

      row.appendChild(bubble);
      messagesEl.insertBefore(row, typingRow);
      scrollToBottom();
    }

    function showTyping() {
      typingRow.style.display = "flex";
      typingEl.classList.add("show");
      scrollToBottom();
    }

    function hideTyping() {
      typingEl.classList.remove("show");
      typingRow.style.display = "none";
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;

      addBubble(text, "user", false);
      inputEl.value = "";
      autoResize();
      setBusy(true);
      showTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: history }),
        });

        const data = await res.json();
        hideTyping();

        if (data.error) {
          addBubble("⚠️ " + data.error, "bot", true);
        } else {
          const reply = data.response;
          addBubble(reply, "bot", false);
          // VULNERABILITY HOOK 4: action commands from model response executed without authorization check
          if (data.actions_executed && data.actions_executed.length > 0) {
            data.actions_executed.forEach(function(act) {
              const arow = document.createElement("div");
              arow.className = "row bot";
              const notice = document.createElement("div");
              notice.className = "action-notice";
              notice.textContent = "⚡ Action executed: " + act.action + " — " + act.params.join(" / ") + " [" + act.status + "]";
              arow.appendChild(notice);
              messagesEl.insertBefore(arow, typingRow);
            });
            scrollToBottom();
          }
          // Persist the exchange so the next request carries full context.
          history.push({ role: "user", content: text });
          history.push({ role: "assistant", content: reply });
        }
      } catch (err) {
        hideTyping();
        addBubble("⚠️ Unable to reach SecureBot. Please check your connection and try again.", "bot", true);
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }

    inputEl.addEventListener("input", autoResize);

    // Enter sends; Shift+Enter inserts a newline.
    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    sendBtn.addEventListener("click", send);

    inputEl.focus();
  </script>
</body>
</html>
